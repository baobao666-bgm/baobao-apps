# Auto-update the manifests when upstream releases new versions.
# - 每天 06:00 UTC（北京时间 14:00）检查一次；也可在 Actions 页手动触发
# - 上游发新版 => 校验通过后创建/更新一个更新 PR（bot/update-manifests），不再直推 main
# - 任何包检查失败：本次不产生任何提交，workflow 失败并输出逐包结果
# - PR 由人工审查合并（不自动合并）
name: auto-update

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write      # 失败时开/更新 issue，而不是只留一行日志

# 定时与手动触发的运行相互排队，避免并发覆盖
concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Check upstream versions and update manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          node .github/scripts/update.js 2>&1 | tee /tmp/update.log

      - name: Report the failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="auto-update: manual review required"
          {
            echo "The manifest check failed at $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo ""
            echo '```'
            tail -n 40 /tmp/update.log 2>/dev/null || true
            echo '```'
            echo ""
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > /tmp/issue.md
          NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue.md
            echo "Commented on existing issue #$NUM."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file /tmp/issue.md
          fi

      - name: Create or update the update PR
        id: pr
        env:
          # 有 PAT 时用它建 PR：PR 作者是真人，pull_request 事件会正常触发 validate，
          # 必需检查能挂在 PR 上。只有 GITHUB_TOKEN 时 PR 由 bot 创建，事件被抑制，
          # 需要在 PR 页点一次 "Approve workflows to run"。
          GH_TOKEN: ${{ secrets.AUTO_UPDATE_TOKEN || github.token }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No manifest changes, nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          BRANCH="bot/update-manifests"
          git config user.name "scoop-bucket-ci"
          git config user.email "scoop-bucket-ci@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # 只提交预期清单变化（update.js 只在 bucket/ 下写文件）
          git add bucket/
          git diff --cached --stat
          git commit -m "auto: update manifests ($(date -u +%Y-%m-%d))"
          git push -f origin "HEAD:refs/heads/$BRANCH"

          # 只看 OPEN 状态：`gh pr view` 对已关闭的同名 PR 也会命中，会让后续更新
          # 永远不再开新 PR（只默默改分支）。
          OPEN_PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$OPEN_PR" ]; then
            echo "Open PR #$OPEN_PR already exists for '$BRANCH'; branch updated in place."
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "auto: update manifests ($(date -u +%Y-%m-%d))" \
              --body "Automated manifest update produced by the auto-update workflow.

          - Only files under \`bucket/\` are included.
          - Run the validation workflow, review upstream release notes, then merge manually."
          fi
